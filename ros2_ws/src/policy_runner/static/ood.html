<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OOD Monitor</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    header { padding: 12px 16px; border-bottom: 1px solid #333; }
    header h1 { margin: 0; font-size: 18px; }
    .scores { padding: 8px 16px; font-size: 14px; display: flex; gap: 24px; }
    .scores .label { opacity: 0.6; margin-right: 6px; }
    .panels { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 8px 8px; }
    .panel { flex: 1 1 320px; min-width: 320px; height: 360px; }
  </style>
</head>
<body>
  <header><h1>OOD Monitor</h1></header>
  <div class="scores" id="scores">loading...</div>
  <div class="panels" id="panels"></div>
  <script src="/ood.js"></script>
</body>
</html>
