# Camera + joint-state topics for the live data-availability monitor
# (policy_runner web_monitor node) and ACT inference input (act_infer_mujoco node).
#
# Verified live against univ.perception's actual "avatar" rig (right UR arm
# + dexterous hand) on 2026-09-02 (see README "Live data-availability
# monitor"): `/joint_states` (24 names, RELIABLE QoS) is the training
# robot's combined joint state. Of the 5 candidate cameras under
# /avatar/..., camera100 was NOT publishing when checked; camera101,
# camera102, side_cam, and wrist_cam were live at ~30Hz (BEST_EFFORT).
# `group` below only controls which panel a camera renders in (see
# static/index.html) -- it is not ROS metadata. None of the cameras carry a
# `left`/`top` label anywhere in ROS; confirmed with the user (2026-09-03):
# camera100 = left, camera101 = right (unused by this policy), camera102 =
# top. See `act_inference.camera_topic_map` below.

web:
  host: 0.0.0.0
  port: 8080

image_transport: compressed   # raw | compressed -- raw drops frames with 5
                               # simultaneous cameras on this rig (see README
                               # "Live data-availability monitor" debug notes)
preview_fps: 10.0
online_timeout_seconds: 3.0

# group: external | wrist | right | tactile -- selects which panel in
# static/index.html the camera's tile renders in. A panel with no cameras
# assigned just renders empty.
cameras:
  camera100:
    group: external
    topic: /avatar/camera100/camera100/color/image_raw
  camera101:
    group: external
    topic: /avatar/camera101/camera101/color/image_raw
  camera102:
    group: external
    topic: /avatar/camera102/camera102/color/image_raw
  wrist_cam:
    group: wrist
    topic: /avatar/right_arm/wrist_cam/wrist_cam/color/image_raw
  side_cam:
    group: wrist
    topic: /avatar/right_arm/wrist_cam/side_cam/color/image_raw

joint_states:
  joint_states:
    topic: /joint_states
    qos:
      reliability: reliable   # reliable | best_effort
      depth: 10

# act_infer_mujoco node: ACT inference driving a MuJoCo model's qpos directly
# (visualization only -- no actuators/mj_step, no UDP command to the real robot).
act_inference:
  # Order matters -- must match the trained task's camera_names
  # (aloha_scripts/constants.py TASK_CONFIGS["real_pick_yellow_bottle"]).
  camera_names: [left, top]
  # logical camera_names entry -> key under `cameras:` above
  camera_topic_map:
    left: camera100
    top: camera102
  control_hz: 30.0
  # false (default): query the model once every chunk_size steps, serve the buffered
  # chunk open-loop -- cheap, but action can visibly "step" at each requery.
  # true: query every step and blend overlapping chunk predictions (exponential decay,
  # see act_model.py) for smoother output, at chunk_size-x inference cost.
  temporal_agg: true
  temporal_agg_k: 0.01   # only used when temporal_agg: true -- larger = weights older buffered
                          # chunks more heavily; 0 = uniform average across buffered chunks
  # Paths as seen INSIDE the container (docker/run/run_docker.sh mounts host
  # ~/code/act -> ~/act and host ~/code/Honda_proto5_description ->
  # ~/Honda_proto5_description; this node only ever runs in-container).
  
  # ckpt_path: /home/asu/act/results/sweep_real_pick_yellow_bottle_20260902/confirm/combo_aggressive/policy_best.ckpt
  ckpt_path: /home/asu/act/results/sweep_real_pick_yellow_bottle_20260902/confirm/combo_hedge/policy_best.ckpt
  act_repo_root: /home/asu/act
  mjcf_path: /home/asu/Honda_proto5_description/mjcf/hmf_hand_proto5_release_right_ur7e_scene_template_joint_ctrl.xml
  # UDP output of the predicted action (JOINT_ORDER from mujoco_qpos_viz.py) as
  # JSON {timestamp, joint_names, positions}, sent once per inference tick to a
  # LAN robot-control host. Leave host blank to disable until configured (or
  # override both with --udp-host/--udp-port; --no-udp disables outright).
  udp_output:
    host: "192.168.1.12"
    port: 6000

# OOD indicator -- logging/visualization only, never gates or alerts. Serves a page at
# http://<web.host>:<web.port>/ with, per modality (qpos + one per camera), the training
# set's UMAP cloud, the live point on top, and its k-NN distance to the training set.
# reference_dir is built offline, per checkpoint, by:
#   ros2 run policy_runner ood_build_reference --ckpt <act_inference.ckpt_path>
# which writes <ckpt_dir>/ood_reference/. It MUST match ckpt_path above.
ood_monitor:
  enabled: false
  reference_dir: /home/asu/act/results/sweep_real_pick_yellow_bottle_20260902/confirm/combo_hedge/ood_reference
  knn_k: 5              # match ood_build_reference --knn-k, or the ratio-vs-train baseline is off
  umap_hz: 10.0         # live-point re-projection rate (UMAP.transform is the expensive part);
                        # k-NN distance updates every control tick regardless
  web:
    host: 0.0.0.0
    port: 8081          # web_monitor already uses 8080
