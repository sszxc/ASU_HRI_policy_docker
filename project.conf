# Full base image reference, e.g. "registry:port/image:tag"
# Same base as asu_state_reward_ws (Ubuntu 24.04 + CUDA/GL + Python 3.12 +
# ROS1 Noetic src + ROS2 Jazzy + bridge). No extra intermediary layer needed
# for ACT training/inference deps -- they are pip-installed in user.Dockerfile.
base_image="hri5792:5000/v03:24.04.cudagl-core-py-noetic.src-jazzy.brg"

# Short identifier used to tag the built image and locate running containers
project_name="asu_il_policy"

# Path to this repo relative to /home/$USER, e.g. "projects/my_project_ws"
project_workspace="projects/asu_il_policy_ws"

# project data container
project_data_container="/data"

# Docker shared memory size — must not exceed the host limit (check: df -h /dev/shm)
shm_size="63g"
